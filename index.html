<!doctype html>
<html lang="es" class="dp-preloading">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2343C4" />
    <meta name="description" content="DealPush - Catálogo de vehículos." />
    <style>
      html.dp-preloading,
      html.dp-preloading body {
        overflow: hidden;
      }

      .dp-initial-preloader {
        position: fixed;
        inset: 0;
        z-index: 20000;
        width: 100vw;
        height: 100dvh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background-color: #182e88;
        --reveal-radius: 0px;
        -webkit-mask-image: radial-gradient(circle at center, transparent var(--reveal-radius), #000 calc(var(--reveal-radius) + 1px));
        mask-image: radial-gradient(circle at center, transparent var(--reveal-radius), #000 calc(var(--reveal-radius) + 1px));
        pointer-events: auto;
      }

      .dp-initial-preloader .loader {
        position: relative;
        z-index: 1;
        width: 45px;
        aspect-ratio: 1;
        --c: no-repeat linear-gradient(#DCE6F5 0 0);
        background:
          var(--c) 0 0,
          var(--c) 0 100%,
          var(--c) 50% 50%,
          var(--c) 100% 0,
          var(--c) 100% 100%;
        animation: l13 1s infinite alternate;
      }

      .dp-initial-reveal {
        position: absolute;
        z-index: 2;
        inset: 0;
        width: 100%;
        height: 100%;
        background-color: transparent;
        transform: scale(0);
        transform-origin: center center;
        visibility: hidden;
        pointer-events: none;
        will-change: transform;
      }

      @keyframes l13 {
        0%, 10% { background-size: 20% 100%; }
        50% { background-size: 20% 20%; }
        90%, 100% { background-size: 100% 20%; }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <title>DealPush | Catálogo de vehículos</title>
  </head>
  <body>
    <div id="dp-initial-preloader" class="dp-initial-preloader" aria-hidden="true">
      <div class="loader"></div>
      <div class="dp-initial-reveal"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
